name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tripbuddy
          POSTGRES_PASSWORD: tripbuddy
          POSTGRES_DB: tripbuddy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tripbuddy" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tripbuddy:tripbuddy@localhost:5432/tripbuddy
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:setup
      - run: npm run build
      - name: End-to-end
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/robots.txt > /dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3000 E2E_BROWSER=$(which google-chrome) npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: .e2e-shots
